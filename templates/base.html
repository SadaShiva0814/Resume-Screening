<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Resume Screening{% endblock %}</title>
    <meta name="description" content="AI-Powered Resume Screening using NLP and Machine Learning — Semantic understanding beyond keyword matching">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <span class="logo-icon">🧠</span>
                <span class="logo-text">ResumeAI</span>
            </a>
            <div class="nav-links">
                <a href="/upload" class="nav-link">Screen Resumes</a>
                <a href="/ats" class="nav-link">ATS Search <span style="font-size: 0.6rem; vertical-align: top; color: var(--primary); font-weight: 800;">FAISS</span></a>
                <a href="/history" class="nav-link">History</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>AI Resume Screening System — Semantic NLP-Based Candidate Ranking</p>
            <p class="footer-sub">Powered by Sentence-BERT • spaCy • Flask • Persistent JSON Store</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
